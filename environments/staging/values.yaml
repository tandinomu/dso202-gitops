# C3: created in dso202-staging by the Sealed Secrets controller.
existingSecret: tasktracker-credentials

database:
  image:
    tag: "1.0"

backend:
  image:
    tag: "1.0"
  replicas: 1

frontend:
  image:
    tag: "1.0"
  replicas: 1
  service:
    # C10: not mapped by kind; reach it with kubectl port-forward.
    nodePort: 30081
