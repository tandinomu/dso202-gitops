# =============================================================================
# File        : charts/tasktracker/templates/serviceaccount.yaml
# Assignment  : DSO202 Assignment 4 (chart from Assignment 3)
# Descriptor  : Unit II 2.3 - ServiceAccounts
# Purpose     : A dedicated identity for the Task Tracker Pods instead of the
#               namespace's 'default' ServiceAccount. None of the tiers calls
#               the Kubernetes API, so no token is mounted.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "tasktracker.labels" . | nindent 4 }}
automountServiceAccountToken: false
