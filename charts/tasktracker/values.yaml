# =============================================================================
# File        : charts/tasktracker/values.yaml
# Assignment  : DSO202 Assignment 4 (chart from Assignment 3)
# Descriptor  : Unit III 3.2 - Helm values; Unit IV 4.3 - GitOps delivery
# Purpose     : Defaults shared by every environment. Anything that differs
#               between dev and staging lives in environments/<env>/values.yaml.
#
# Values marked [A1] must match how the images were built in Assignment 1
# (Service names the frontend proxies to, ports, environment variable names).
# Check them before Task 1, step 6.
# =============================================================================

# C3: the chart never renders a Secret. Pods read credentials from this
# existing Secret, which the Sealed Secrets controller creates in each
# namespace from platform/<env>/tasktracker-credentials.sealed.yaml.
# Keys expected: DB_USER, DB_PASSWORD, POSTGRES_USER, POSTGRES_PASSWORD.
existingSecret: tasktracker-credentials

# Not 'Always': images loaded with 'kind load docker-image' (section 13) are
# then used without contacting Docker Hub.
imagePullPolicy: IfNotPresent

# C6: a failed rollout is reported as Degraded after 2 minutes instead of the
# Kubernetes default of 10 minutes. Applied to the backend and frontend.
rollout:
  progressDeadlineSeconds: 120

# -----------------------------------------------------------------------------
# Database tier (StatefulSet, sync wave 0)
# -----------------------------------------------------------------------------
database:
  # [A1] The backend connects to this Service name (see backend.env.DB_HOST).
  serviceName: tasktracker-database
  image:
    repository: <dockerhub-username>/dso202-db
    # C1: set per environment; the template refuses to render without it.
    tag: ""
  # A single PostgreSQL instance; it is not replicated in this assignment.
  replicas: 1
  port: 5432
  storage: 1Gi
  # C2: non-secret configuration, rendered into a ConfigMap.
  env:
    POSTGRES_DB: tasktracker
    # A subdirectory avoids the 'lost+found' directory of a fresh volume.
    PGDATA: /var/lib/postgresql/data/pgdata
  # C7
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -----------------------------------------------------------------------------
# Backend tier (Deployment, sync wave 1)
# -----------------------------------------------------------------------------
backend:
  # [A1] The frontend proxies API calls to this Service name, and the
  # smoke-test Job calls it.
  serviceName: tasktracker-backend
  image:
    repository: <dockerhub-username>/dso202-backend
    tag: ""
  replicas: 1
  # [A1]
  port: 8080
  # C4: readiness endpoint required by the brief.
  readinessPath: /api/status
  # C2: every key here becomes an environment variable of the backend.
  # Adding a variable (Task 7, fix-forward) is a values change only.
  # [A1] Use the variable names your backend reads.
  env:
    DB_HOST: tasktracker-database
    DB_PORT: "5432"
    DB_NAME: tasktracker
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -----------------------------------------------------------------------------
# Frontend tier (Deployment, sync wave 2)
# -----------------------------------------------------------------------------
frontend:
  serviceName: tasktracker-frontend
  image:
    repository: <dockerhub-username>/dso202-frontend
    tag: ""
  replicas: 1
  # [A1] Port the frontend container listens on.
  port: 80
  readinessPath: /
  env: {}
  # C10: NodePort; the port number is set per environment (30080 / 30081).
  service:
    type: NodePort
    port: 80
    nodePort: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
